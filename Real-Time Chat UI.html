<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat UI</title>

<style>
:root{
  --primary:#2563eb;
  --light:#f3f4f6;
  --sidebar:#1e293b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body{
  background:var(--light);
  height:100vh;
  display:flex;
}

/* Sidebar */
.sidebar{
  width:250px;
  background:var(--sidebar);
  color:white;
  padding:20px;
}

.sidebar h2{
  margin-bottom:15px;
}

.contact{
  padding:10px;
  background:rgba(255,255,255,0.1);
  margin-bottom:10px;
  border-radius:6px;
  cursor:pointer;
}

/* Chat Area */
.chat-container{
  flex:1;
  display:flex;
  flex-direction:column;
}

.header{
  padding:15px;
  background:white;
  border-bottom:1px solid #ddd;
  font-weight:bold;
}

.chat-box{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

.message{
  max-width:70%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}

.sent{
  align-self:flex-end;
  background:var(--primary);
  color:white;
}

.received{
  align-self:flex-start;
  background:#e5e7eb;
}

/* Input */
.input-area{
  display:flex;
  padding:15px;
  background:white;
  border-top:1px solid #ddd;
}

input{
  flex:1;
  padding:10px;
  border:1px solid #ddd;
  border-radius:5px;
}

button{
  margin-left:10px;
  padding:10px 15px;
  border:none;
  background:var(--primary);
  color:white;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">

<h2>Chats</h2>

<div class="contact">Ravi</div>
<div class="contact">Anita</div>
<div class="contact">Kiran</div>

</div>

<div class="chat-container">

<div class="header">Ravi</div>

<div class="chat-box" id="chatBox">

<div class="message received">Hello Vijay 👋</div>

</div>

<div class="input-area">

<input type="text" id="messageInput" placeholder="Type a message...">

<button onclick="sendMessage()">Send</button>

</div>

</div>

<script>

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("messageInput");

function sendMessage(){

const text = input.value.trim();

if(!text) return;

const msg = document.createElement("div");
msg.className = "message sent";
msg.innerText = text;

chatBox.appendChild(msg);

input.value="";

chatBox.scrollTop = chatBox.scrollHeight;

// Fake reply
setTimeout(()=>{

const reply = document.createElement("div");
reply.className = "message received";
reply.innerText = "Received: " + text;

chatBox.appendChild(reply);

chatBox.scrollTop = chatBox.scrollHeight;

},1000);

}

</script>

</body>
</html>
